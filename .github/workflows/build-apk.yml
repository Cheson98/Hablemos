name: APK bouwen

# Bouwt bij elke push naar main een installeerbare Android-APK en zet die op de
# releasepagina (tag "latest"). Je kunt hem ook met de hand starten: tabblad Actions > APK bouwen > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pakketten installeren
        run: npm install --no-audit --no-fund

      - name: Pakketversies op de Expo-versie afstemmen
        run: npx expo install --fix

      - name: Lesinhoud controleren
        run: |
          node scripts/validate-content.mjs
          npx tsx scripts/check-answers.ts
          node scripts/build-index.mjs

      - name: Tests draaien
        run: npx tsx --test tests/*.test.ts

      - name: Typecontrole (mag falen zonder de build te stoppen)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Android-project genereren
        run: npx expo prebuild --platform android --no-install --clean

      - name: APK bouwen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: APK klaarzetten
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/Hablemos.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Hablemos-apk
          path: out/Hablemos.apk

      - name: Release "latest" bijwerken
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/Hablemos.apk \
            --target "${{ github.sha }}" \
            --title "Hablemos (build ${{ github.run_number }})" \
            --notes "Download Hablemos.apk op je telefoon en open het bestand om te installeren. Build ${{ github.run_number }}, commit ${{ github.sha }}." \
            --latest
