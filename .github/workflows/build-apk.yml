name: Bouw Android-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pakketten installeren
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Lesinhoud controleren
        run: |
          node scripts/validate-content.mjs
          node scripts/build-index.mjs
          npx tsx scripts/check-answers.ts

      - name: Tests
        run: npx tsx --test tests/*.test.ts

      - name: Types controleren (waarschuwing, blokkeert de build niet)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Android-project genereren
        run: npx expo prebuild --platform android --no-install --clean

      - name: Android-licenties accepteren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK bouwen
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: APK klaarzetten
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Hablemos.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Hablemos-apk
          path: out/Hablemos.apk

      - name: Release "latest" bijwerken (downloadlink voor je telefoon)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/Hablemos.apk \
            --target "${{ github.sha }}" \
            --title "Hablemos (build ${{ github.run_number }})" \
            --notes "Nieuwste versie van Hablemos. Download Hablemos.apk op je Android-telefoon en open het bestand om te installeren." \
            --latest
